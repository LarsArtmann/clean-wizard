version: "2"
run:
  timeout: 10m
  go: 1.26.5
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  default: none
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct:
      exclude:
        - os/exec.Cmd
        - github.com/spf13/cobra.Command
        - github.com/maypok86/otter/v2.Options
        - github.com/caarlos0/env/v6.Options
        - github.com/Azure/go-workflow.Workflow
        - github.com/LarsArtmann/clean-wizard/internal/domain.CleanResult
        - github.com/LarsArtmann/clean-wizard/internal/execution.WorkflowResult
        - github.com/LarsArtmann/clean-wizard/internal/execution.resultCollector
    funlen:
      lines: 100
      statements: 60
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G115
        - G118
        - G204
        - G301
        - G304
        - G306
        - G703
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    nestif:
      min-complexity: 7
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-package-globs:
        - github.com/LarsArtmann/clean-wizard/internal/*
        - encoding/*
        - os
        - time
        - charm.land/*
  exclusions:
    generated: lax
    rules:
      - path: .*_test\.go
        linters:
          - cyclop
          - gosec
          - wrapcheck
      - path: .*_test\.go
        text: unused-parameter|empty-block
        linters:
          - revive
      - path: tests/bdd/.*\.go
        text: unused-parameter
        linters:
          - revive
      - path: internal/cleaner/testing_helpers\.go
        text: unused-parameter
        linters:
          - revive
      - path: internal/cleaner/test_factories\.go
        text: unused-parameter
        linters:
          - revive
      - path: internal/cleaner/ginkgo_test_helpers\.go
        linters:
          - exhaustruct
          - goconst
      - path: internal/cleaner/test_assertions\.go
        linters:
          - exhaustruct
          - goconst
      - path: internal/domain/enum_macros\.go
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
