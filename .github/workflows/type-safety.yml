name: CI
description: Build, test, and type safety validation for all code changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -short -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  type-safety:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Type Safety Linting
        run: |
          echo "Type safety validation..."

          # 1. Check for map[string]any violations (exclude tests, comments, YAML serialization)
          if grep -r "map\[string\]any" internal/ --include="*.go" --exclude="*_test.go" --exclude-dir=vendor \
            | grep -v "//" \
            | grep -v "environment.go" \
            | grep -v "config.go"; then
            echo "VIOLATION: map[string]any found in production code"
            exit 1
          fi
          echo "OK: No map[string]any violations"

          # 2. Check for interface{} abuse
          if grep -r "interface{}" internal/ --include="*.go" --exclude-dir=vendor; then
            echo "VIOLATION: interface{} found"
            exit 1
          fi
          echo "OK: No interface{} violations"

          # 3. Check for unsafe package usage
          if grep -r "unsafe\." internal/ --include="*.go" --exclude-dir=vendor; then
            echo "VIOLATION: unsafe package usage"
            exit 1
          fi
          echo "OK: No unsafe package violations"

          # 4. Check for reflect package usage in production code (exclude tests and comments)
          if grep -r "reflect\." internal/ --include="*.go" --exclude="*_test.go" --exclude-dir=vendor \
            | grep -v "//"; then
            echo "VIOLATION: reflect package usage in production code"
            echo "If reflection is necessary, add // REFLECT-JUSTIFIED: <reason> comment"
            exit 1
          fi
          echo "OK: No reflect package violations in production code"
