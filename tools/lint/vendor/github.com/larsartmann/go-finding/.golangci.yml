version: "2"
run:
  timeout: 5m
  go: "1.27"
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
    - noinlineerr
    - paralleltest
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct_v5:
      ignore-patterns:
        - ^github\.com/larsartmann/go-finding\.[A-Za-z0-9_]+$
        - ^github\.com/larsartmann/go-finding/[a-z/]+\.[A-Za-z0-9_]+$
    funlen:
      lines: 120
      statements: 80
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 25
    godot:
      scope: toplevel
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G102
        - G104
        - G301
        - G304
        - G306
        - G307
        - G404
        - G401
        - G505
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - github.com/larsartmann/go-finding/pipeline.Detector
        - github.com/larsartmann/go-finding/pipeline.FindingTransformer
    makezero:
      always: false
    mnd:
      ignored-functions:
        - fmt.Errorf
        - fmt.Fprintf
        - fmt.Sprintf
        - time.ParseDuration
        - os.WriteFile
        - os.MkdirAll
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: false
          name: unused-parameter
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: exported
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: unused-receiver
          severity: warning
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
        - r
        - r1
        - r2
        - f
        - f1
        - f2
        - d
        - d1
        - d2
        - p
        - s
        - c
        - w
        - "n"
        - h
        - e
        - k
        - j
        - id
        - tc
        - op
        - fb
        - gf
        - fe
        - pl
        - cf
        - mu
        - wg
        - cw
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-finding/*
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - err113
          - exhaustruct_v5
          - goconst
          - wrapcheck
          - unparam
          - testpackage
          - exhaustruct
          - gochecknoglobals
          - funlen
          - cyclop
          - forcetypeassert
          - gosec
          - errcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
      - path: cmd/
        linters:
          - gochecknoglobals
          - gochecknoinits
      - path: examples/
        linters:
          - exhaustruct_v5
          - forbidigo
          - mnd
      - path: sarif_types\.go
        linters:
          - exhaustruct_v5
          - goconst
      - path: sarif_export\.go
        linters:
          - exhaustruct_v5
      - path: sarif_import\.go
        linters:
          - exhaustruct_v5
      - path: lsp\.go
        linters:
          - exhaustruct_v5
      - path: version\.go
        linters:
          - gochecknoglobals
      - path: filter\.go
        linters:
          - exhaustruct_v5
      - path: confidence\.go
        linters:
          - goconst
      - path: severity\.go
        linters:
          - goconst
          - gochecknoglobals
      - path: category_linter\.go
        linters:
          - goconst
          - gochecknoglobals
      - path: json\.go
        linters:
          - gochecknoglobals
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - cmd/go-finding/
      - pipeline/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
    - swaggo
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
      - cmd/go-finding/
      - pipeline/
issues:
  max-issues-per-linter: 100
  max-same-issues: 5
